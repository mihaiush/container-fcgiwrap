name: Build and Push Docker Image (amd64)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    
permissions:
  contents: read
  packages: write

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-and-push:
    needs: hadolint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract data from Dockerfile
        id: dockervars
        run: |
          if [ -x "dockervars.sh" ] ; then
            . <(./dockervars.sh)
          fi
          if [ -z "$NAME" ] ; then
            NAME=$(echo "${{ github.event.repository.name }}" | awk -F'container-' '{print $2}')
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ] ; then
            TAG=$(echo $NAME | tr '[a-z]' '[A-Z]')
            TAG=$(awk -F'"' '/'${TAG}'_VERSION=/{print $2}' Dockerfile)
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]$ ]]; then
            TAG="${TAG}.${{ github.run_number }}"
          else
            TAG="${TAG}-${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.dockervars.outputs.name }}
          tags: |
            # Fixed prefix combined with extracted Dockerfile base version
            type=raw,value=${{ steps.dockervars.outputs.tag }}
            
            # Optional: Keep 'latest' tag on the main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
